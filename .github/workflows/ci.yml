name: ci
on: push
jobs:
  test-high-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Run tests in high resolution 🧪
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          record: true
          group: '1. Resolution is high'
          expose: resolution=high
          # set viewport smaller to avoid scrollbars
          config: viewportWidth=1820,viewportHeight=1000
          browser: chrome
        env:
          DEBUG: cypress-high-resolution
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  test-4k-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Run tests in 4k resolution 🧪
        uses: cypress-io/github-action@v7
        with:
          record: true
          group: '2. Resolution is 4k'
          expose: resolution=4k
          # increase the viewport to capture more details
          # set the viewport slightly smaller to avoid scrollbars
          config: viewportWidth=3740,viewportHeight=2060
          browser: chrome
        env:
          DEBUG: cypress-high-resolution
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  test-low-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Run tests in low resolution 🧪
        uses: cypress-io/github-action@v7
        with:
          record: true
          group: '3. Resolution is 700x600'
          expose: resolution=700x600
          config: viewportWidth=600,viewportHeight=500
          browser: chrome
        env:
          DEBUG: cypress-high-resolution
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  release:
    runs-on: ubuntu-latest
    needs: [test-high-resolution, test-4k-resolution, test-low-resolution]

    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      # https://glebbahmutov.com/blog/npm-publish-from-github/
      id-token: write

    steps:
      - name: Checkout 🛎
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Install dependencies 📦
        # https://github.com/cypress-io/github-action
        uses: cypress-io/github-action@v7
        with:
          runTests: false

      - name: Semantic Release 🚀
        # https://github.com/cycjimmy/semantic-release-action
        uses: cycjimmy/semantic-release-action@v6
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
